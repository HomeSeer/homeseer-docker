name: Build HomeSeer Base Docker Image

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base image version"
        required: true
        default: "3.0"
        type: string

      mode:
        description: "Build mode"
        required: true
        type: choice
        options:
          - push
          - load
        default: push

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: inputs.mode == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          IMAGE_NAME: ghcr.io/${{ env.OWNER_LC }}/homeseer-base
        run: |
          chmod +x base/build.sh
          cd base
          ./build.sh --mode "${{ inputs.mode }}"